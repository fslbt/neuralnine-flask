<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FLASK APP</title>

</head>
<body>
    <h1>Hello World</h1>
    <p>{{myval}}</p>
    <p>{{myresult}} </p>
    <p>{{mylist}} </p>

    <ul>
        {% for item in mylist %}
            {% if item==3%}
            <li style="color:red">{{item}}</li>
            {%else%}
                <li style="color:blue">{{item}}</li>
            {%endif%}
        {% endfor %}
    </ul>
</body>

</html>
